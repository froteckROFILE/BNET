name: Build and publish Interstellar Time APK
on:
  push:
    branches: [interstellar-time]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BNET-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: interstellar-time-direct
          name: Interstellar Time - APK direct
          body: APK debug installable directement sur Android.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
