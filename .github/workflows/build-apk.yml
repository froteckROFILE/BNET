name: Build and publish Interstellar Time 0.4.0
on:
  push:
    branches: [interstellar-time]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BNET-interstellar-time-0.4.0
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: interstellar-time-v0.4.0
          name: Interstellar Time 0.4.0 - APK direct
          body: Horloge BNET synchronisée, cinq modèles et widget.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
